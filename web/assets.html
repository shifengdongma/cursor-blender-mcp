<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AIGV Studio资产库 - 管理3D模型、图片素材与Prompt文档，支持在线预览与下载" />
    <meta name="keywords" content="AIGV, 资产库, 3D模型, GLB, Prompt, 文创视频" />
    <meta name="theme-color" content="#f2b33d" />
    <title>资产库 - AIGV Studio</title>
    <link rel="stylesheet" href="/web/styles.css" />
    <!-- Preconnect for external resources -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <!-- Google Model Viewer for GLB preview -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      /* Asset Library Specific Styles */
      .asset-library-page {
        padding-top: 80px;
        min-height: 100vh;
      }

      .page-header {
        max-width: 1400px;
        margin: 0 auto;
        padding: var(--space-2xl) var(--space-xl);
        text-align: center;
      }

      .page-title {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 700;
        margin-bottom: var(--space-md);
        letter-spacing: -0.02em;
      }

      .page-desc {
        font-size: 1.1rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto;
      }

      /* Tab Navigation */
      .tab-nav {
        display: flex;
        justify-content: center;
        gap: var(--space-md);
        margin-bottom: var(--space-xl);
        padding: 0 var(--space-xl);
      }

      .tab-btn {
        padding: var(--space-md) var(--space-xl);
        background: transparent;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-full);
        color: var(--text-secondary);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }

      .tab-btn:hover {
        border-color: var(--border-strong);
        color: var(--text-primary);
      }

      .tab-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #1a1205;
      }

      /* Filter Bar */
      .filter-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-lg);
        max-width: 1400px;
        margin: 0 auto var(--space-xl);
        padding: 0 var(--space-xl);
        flex-wrap: wrap;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        flex: 1;
        max-width: 400px;
        padding: var(--space-sm) var(--space-md);
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-full);
      }

      .search-box input {
        flex: 1;
        border: none;
        background: transparent;
        padding: var(--space-sm);
        font-size: 0.9rem;
        color: var(--text-primary);
      }

      .search-box input:focus {
        outline: none;
        box-shadow: none;
      }

      .search-icon {
        width: 18px;
        height: 18px;
        color: var(--text-muted);
      }

      .filter-select {
        padding: var(--space-sm) var(--space-md);
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 0.9rem;
        min-width: 150px;
      }

      /* Asset Grid */
      .asset-library-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: var(--space-lg);
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 var(--space-xl) var(--space-2xl);
      }

      /* Asset Card */
      .library-asset-card {
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-xl);
        overflow: hidden;
        transition: all 0.3s;
      }

      .library-asset-card:hover {
        border-color: var(--border-strong);
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
      }

      .asset-preview {
        width: 100%;
        height: 200px;
        background: var(--bg-elevated);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .asset-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .asset-preview model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }

      .asset-preview .placeholder-icon {
        width: 64px;
        height: 64px;
        color: var(--text-muted);
        opacity: 0.3;
      }

      .asset-type-badge {
        position: absolute;
        top: var(--space-sm);
        left: var(--space-sm);
        padding: var(--space-xs) var(--space-sm);
        background: rgba(0, 0, 0, 0.6);
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-primary);
        text-transform: uppercase;
      }

      .asset-info {
        padding: var(--space-lg);
      }

      .asset-info h3 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: var(--space-sm);
      }

      .asset-info p {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-bottom: var(--space-md);
        line-height: 1.5;
      }

      .asset-meta-info {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
      }

      .meta-tag {
        padding: var(--space-xs) var(--space-sm);
        background: rgba(255, 255, 255, 0.05);
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .asset-actions {
        display: flex;
        gap: var(--space-sm);
        margin-top: var(--space-md);
        padding-top: var(--space-md);
        border-top: 1px solid var(--border-subtle);
      }

      .asset-btn {
        flex: 1;
        padding: var(--space-sm) var(--space-md);
        background: transparent;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .asset-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .asset-btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #1a1205;
      }

      .asset-btn.primary:hover {
        background: var(--primary-dark);
      }

      /* Prompt Document Card */
      .prompt-doc-card {
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-xl);
        padding: var(--space-lg);
        transition: all 0.3s;
      }

      .prompt-doc-card:hover {
        border-color: var(--border-strong);
      }

      .doc-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: var(--space-md);
      }

      .doc-category {
        padding: var(--space-xs) var(--space-sm);
        background: rgba(116, 200, 211, 0.1);
        border: 1px solid rgba(116, 200, 211, 0.2);
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        color: var(--accent-cyan);
        text-transform: uppercase;
      }

      .doc-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: var(--space-sm);
      }

      .doc-content {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.6;
        white-space: pre-wrap;
        max-height: 150px;
        overflow: hidden;
        position: relative;
      }

      .doc-content::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: linear-gradient(transparent, var(--bg-card));
      }

      .doc-keywords {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        margin-top: var(--space-md);
      }

      /* Upload Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
      }

      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-content {
        width: 100%;
        max-width: 500px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-xl);
        padding: var(--space-xl);
        transform: scale(0.95);
        transition: transform 0.3s;
      }

      .modal-overlay.active .modal-content {
        transform: scale(1);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-xl);
      }

      .modal-header h2 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .modal-close {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        cursor: pointer;
      }

      .modal-close:hover {
        border-color: var(--border-strong);
        color: var(--text-primary);
      }

      .upload-zone {
        padding: var(--space-2xl);
        border: 2px dashed var(--border-default);
        border-radius: var(--radius-lg);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
      }

      .upload-zone:hover {
        border-color: var(--primary);
        background: rgba(242, 179, 61, 0.05);
      }

      .upload-zone.dragover {
        border-color: var(--primary);
        background: rgba(242, 179, 61, 0.1);
      }

      .upload-icon {
        width: 48px;
        height: 48px;
        color: var(--text-muted);
        margin-bottom: var(--space-md);
      }

      .upload-text {
        font-size: 0.95rem;
        color: var(--text-secondary);
      }

      .upload-text strong {
        color: var(--primary);
      }

      /* Empty State */
      .empty-state-container {
        text-align: center;
        padding: var(--space-3xl);
      }

      .empty-icon {
        width: 80px;
        height: 80px;
        color: var(--text-muted);
        opacity: 0.3;
        margin-bottom: var(--space-lg);
      }

      .empty-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: var(--space-sm);
      }

      .empty-desc {
        font-size: 0.95rem;
        color: var(--text-secondary);
      }

      /* Loading State */
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-default);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Pagination */
      .pagination {
        display: flex;
        justify-content: center;
        gap: var(--space-sm);
        padding: var(--space-xl);
      }

      .page-btn {
        padding: var(--space-sm) var(--space-md);
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .page-btn:hover {
        border-color: var(--border-strong);
        color: var(--text-primary);
      }

      .page-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #1a1205;
      }

      .page-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="page-bg"></div>

    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="nav-brand">
          <span class="brand-icon"></span>
          <span class="brand-text">AIGV Studio</span>
        </a>
        <div class="nav-links">
          <a href="/">首页</a>
          <a href="/assets" class="active">资产库</a>
          <a href="/#workspace">创作工作台</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="asset-library-page">
      <header class="page-header">
        <h1 class="page-title">资产库</h1>
        <p class="page-desc">管理3D模型、图片素材与Prompt文档，支持在线预览与下载</p>

        <!-- Stats Row -->
        <div class="stats-row" id="stats-row" style="display: flex; justify-content: center; gap: var(--space-xl); margin-top: var(--space-xl);">
          <div class="stat-item" style="text-align: center;">
            <div class="stat-number" style="font-size: 2rem; font-weight: 700; color: var(--primary);">5</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">3D模型</div>
          </div>
          <div style="width: 1px; background: var(--border-default);"></div>
          <div class="stat-item" style="text-align: center;">
            <div class="stat-number" style="font-size: 2rem; font-weight: 700; color: var(--accent-cyan);">16</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">Prompt文档</div>
          </div>
          <div style="width: 1px; background: var(--border-default);"></div>
          <div class="stat-item" style="text-align: center;">
            <div class="stat-number" style="font-size: 2rem; font-weight: 700; color: var(--accent-purple);">4</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">场馆预设</div>
          </div>
        </div>
      </header>

      <!-- Tab Navigation -->
      <nav class="tab-nav" role="tablist" aria-label="资产分类导航">
        <button class="tab-btn active" data-tab="models" role="tab" aria-selected="true" aria-controls="asset-grid">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px; vertical-align: -2px;">
            <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          3D模型
        </button>
        <button class="tab-btn" data-tab="images" role="tab" aria-selected="false" aria-controls="asset-grid">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px; vertical-align: -2px;">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          图片素材
        </button>
        <button class="tab-btn" data-tab="prompts" role="tab" aria-selected="false" aria-controls="asset-grid">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px; vertical-align: -2px;">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Prompt文档
        </button>
      </nav>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="搜索资产..." aria-label="搜索资产" />
        </div>
        <select id="venue-filter" class="filter-select" aria-label="场馆过滤">
          <option value="">全部场馆</option>
          <option value="grand_theater">大剧院</option>
          <option value="modern_gallery">现代画廊</option>
          <option value="ancient_museum">古典博物馆</option>
          <option value="concert_hall">音乐厅</option>
        </select>
        <button class="btn-primary" id="upload-btn" aria-label="上传资产">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          上传资产
        </button>
      </div>

      <!-- Asset Grid -->
      <div id="asset-grid" class="asset-library-grid">
        <!-- Content loaded dynamically -->
      </div>

      <!-- Pagination -->
      <div id="pagination" class="pagination"></div>
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2>上传资产</h2>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <form id="upload-form" enctype="multipart/form-data">
          <div class="upload-zone" id="upload-zone">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p class="upload-text">
              <strong>点击选择文件</strong> 或拖拽到此处
            </p>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: var(--space-sm);">
              支持 GLB、PNG、JPG 等格式
            </p>
            <input type="file" id="file-input" style="display: none;" />
          </div>
          <div class="form-group" style="margin-top: var(--space-lg);">
            <label for="asset-name">资产名称</label>
            <input type="text" id="asset-name" name="name" placeholder="输入资产名称" />
          </div>
          <div class="form-group" style="margin-top: var(--space-md);">
            <label for="asset-type">资产类型</label>
            <select id="asset-type" name="asset_type">
              <option value="glb">3D模型 (GLB)</option>
              <option value="image">图片</option>
              <option value="prompt_doc">Prompt文档</option>
            </select>
          </div>
          <div class="form-group" style="margin-top: var(--space-md);">
            <label for="asset-venue">场馆类型</label>
            <select id="asset-venue" name="venue_type">
              <option value="">通用</option>
              <option value="grand_theater">大剧院</option>
              <option value="modern_gallery">现代画廊</option>
              <option value="ancient_museum">古典博物馆</option>
              <option value="concert_hall">音乐厅</option>
            </select>
          </div>
          <div class="form-group" style="margin-top: var(--space-md);">
            <label for="asset-desc">描述</label>
            <textarea id="asset-desc" name="description" rows="2" placeholder="资产描述..."></textarea>
          </div>
          <div class="form-actions" style="margin-top: var(--space-lg);">
            <button type="button" class="btn-outline" id="cancel-upload">取消</button>
            <button type="submit" class="btn-primary">上传</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/web/assets.js"></script>
  </body>
</html>
