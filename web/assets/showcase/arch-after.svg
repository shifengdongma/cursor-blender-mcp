      <stop offset="1" stop-color="#2d261d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8ef" stop-opacity="0.55"/>
