<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94ddf1" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#78bfd2" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf8b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d7a84f" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="lines" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#78bfd2" stroke-width="0.7" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <polygon points="0,360 800,360 800,450 0,450" fill="url(#floor)"/>
  <polygon points="0,360 800,360 800,450 0,450" fill="url(#lines)"/>
  <path d="M0 360 L400 260 L800 360" fill="none" stroke="#78bfd2" stroke-width="2" opacity="0.4"/>
  <g opacity="0.45" stroke="#94ddf1" stroke-width="1">
    <path d="M100 360 L100 150 L400 80 L700 150 L700 360"/>
    <path d="M180 360 L180 185 L400 125 L620 185 L620 360"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <g transform="translate(240 190)">
    <polygon points="50,0 150,0 170,40 150,80 50,80 30,40" fill="url(#cyan)" opacity="0.25"/>
    <polygon points="60,12 140,12 154,40 140,68 60,68 46,40" fill="none" stroke="#94ddf1" stroke-width="1.5"/>
    <circle cx="100" cy="40" r="18" fill="none" stroke="#94ddf1" stroke-width="1.5"/>
    <circle cx="100" cy="40" r="6" fill="#94ddf1" filter="url(#glow)" opacity="0.8"/>
  </g>
  <g transform="translate(470 205)">
    <polygon points="30,0 120,0 140,36 120,72 30,72 10,36" fill="url(#gold)" opacity="0.2"/>
    <polygon points="40,12 110,12 124,36 110,60 40,60 26,36" fill="none" stroke="#d7a84f" stroke-width="1.4"/>
    <path d="M50 36 H100" stroke="#f0cf8b" stroke-width="1.5"/>
  </g>
  <g opacity="0.35" stroke="#78bfd2" stroke-width="1">
    <line x1="400" y1="80" x2="400" y2="360"/>
    <line x1="100" y1="150" x2="400" y2="360"/>
    <line x1="700" y1="150" x2="400" y2="360"/>
  </g>
  <g opacity="0.5" fill="#94ddf1">
    <circle cx="70" cy="90" r="2"/>
    <circle cx="730" cy="110" r="2"/>
    <circle cx="650" cy="70" r="1.6"/>
